server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/poodle_lms
    username: ${DB_USERNAME:poodle}
    password: ${DB_PASSWORD:poodle}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlLXNlY3JldC1rZXktZm9yLXBvb2RsZS1sbXMtYXBwbGljYXRpb24tMjAyNg==}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

logging:
  level:
    com.enterprise.poodle: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
