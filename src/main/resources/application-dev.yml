server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poodle_lms}
    username: ${DB_USERNAME:poodle}
    password: ${DB_PASSWORD:poodle}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.enterprise.poodle: DEBUG
    com.enterprise.poodle.service: DEBUG
    com.enterprise.poodle.controller: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: INFO
